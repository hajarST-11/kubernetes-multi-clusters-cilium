apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
spec:
  background: true
  rules:
  - name: require-explicit-tag
    match:
      any:
      - resources: {kinds: [Pod]}
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage, external-secrets]
    validate:
      failureAction: Enforce
      message: "Le tag 'latest' (ou l'absence de tag) est interdit : utiliser une version figée."
      pattern:
        spec:
          containers:
          - image: "*:* & !*:latest"
