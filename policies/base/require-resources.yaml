apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-resources
spec:
  background: true
  rules:
  - name: require-requests-limits
    match:
      any:
      - resources: {kinds: [Pod]}
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage, external-secrets]
    validate:
      failureAction: Audit
      message: "Chaque conteneur doit déclarer requests (cpu, memory) et limits (memory)."
      pattern:
        spec:
          containers:
          - resources:
              requests: {cpu: "?*", memory: "?*"}
              limits: {memory: "?*"}
