apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-app-label
spec:
  background: true
  rules:
  - name: require-app
    match:
      any:
      - resources: {kinds: [Pod]}
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage, external-secrets]
    validate:
      failureAction: Audit
      message: "Le label 'app' est obligatoire : il sert d'identité réseau (NetworkPolicy, Cilium)."
      pattern:
        metadata:
          labels:
            app: "?*"
