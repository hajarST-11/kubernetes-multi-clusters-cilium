apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-service-types
spec:
  background: true
  rules:
  - name: clusterip-only
    match:
      any:
      - resources: {kinds: [Service]}
    exclude:
      any:
      - resources:
          namespaces: [kube-system, kube-public, kube-node-lease, kyverno, local-path-storage, external-secrets]
    validate:
      failureAction: Enforce
      message: "Le cluster B n'est pas exposé : seuls les Services ClusterIP sont autorisés."
      pattern:
        spec:
          =(type): "ClusterIP"
